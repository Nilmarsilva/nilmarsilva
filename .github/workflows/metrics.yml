name: GitHub Profile Metrics

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

jobs:
  metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Gerar estatísticas do perfil
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nilmarsilva
          filename: github-metrics.svg
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          config_order: base.header, base.activity+community, base.repositories, base.metadata

      - name: Gerar linguagens mais utilizadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Nilmarsilva
          filename: github-languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          config_timezone: America/Sao_Paulo
